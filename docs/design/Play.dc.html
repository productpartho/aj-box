<style>
body{margin:0}
a{color:#FFD166}a:hover{color:#FFF4FB}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes floatup{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.4)}}
.bounce{animation:bounce .55s ease-in-out infinite}
.note1{animation:floatup 2s ease-out infinite}
.note2{animation:floatup 2s ease-out infinite;animation-delay:1s}
.beat{animation:beat .55s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
