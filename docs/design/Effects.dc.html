<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFD166}a:hover{color:#FFF4FB}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.4);opacity:0}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.4)}}
.bounce{animation:bounce .55s ease-in-out infinite}
.ring{animation:ring 1.1s ease-out infinite}
.ring2{animation-delay:.55s}
.tw{animation:twinkle 1.4s ease-in-out infinite}
.tw2{animation-delay:.5s}
.tw3{animation-delay:.95s}
.beat{animation:beat .55s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
