<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AJ Box mood picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFD166}a:hover{color:#FFF4FB}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin 8s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 240px; height: 240px; position: relative; overflow: hidden; box-sizing: border-box; background: #2A0A3D; font-family: 'Fredoka', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<div role="img" aria-label="Mood: Happy" style="position: relative; width: 112px; height: 112px">
<svg class="spin" style="position: absolute; left: 0; top: 0; width: 112px; height: 112px" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round"><path d="M24 3v6"></path><path d="M24 39v6"></path><path d="M3 24h6"></path><path d="M39 24h6"></path><path d="M9 9l4.2 4.2"></path><path d="M34.8 34.8L39 39"></path><path d="M39 9l-4.2 4.2"></path><path d="M13.2 34.8L9 39"></path></svg>
<svg style="position: absolute; left: 0; top: 0; width: 112px; height: 112px" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="10" fill="#FFD166" stroke="#FFF4FB" stroke-width="2"></circle><circle cx="20.5" cy="22.5" r="1.3" fill="#2A0A3D"></circle><circle cx="27.5" cy="22.5" r="1.3" fill="#2A0A3D"></circle><path d="M20 27c2 2 6 2 8 0" fill="none" stroke="#2A0A3D" stroke-width="1.4" stroke-linecap="round"></path></svg>
</div>
<div role="img" aria-label="Moods: Happy chosen, Dreamy and Spooky" style="display: flex; gap: 16px; align-items: center">
<div style="width: 48px; height: 48px; border-radius: 24px; background: #3D1656; box-shadow: 0 0 0 3px #FFF4FB; display: flex; align-items: center; justify-content: center"><svg style="width: 32px; height: 32px" viewBox="0 0 48 48" aria-hidden="true" stroke-linecap="round"><g fill="none" stroke="#FFD166" stroke-width="3"><path d="M24 3v6"></path><path d="M24 39v6"></path><path d="M3 24h6"></path><path d="M39 24h6"></path><path d="M9 9l4.2 4.2"></path><path d="M34.8 34.8L39 39"></path><path d="M39 9l-4.2 4.2"></path><path d="M13.2 34.8L9 39"></path></g><circle cx="24" cy="24" r="10" fill="#FFD166" stroke="#FFF4FB" stroke-width="3"></circle></svg></div>
<div style="width: 48px; height: 48px; border-radius: 24px; background: #3D1656; display: flex; align-items: center; justify-content: center"><svg style="width: 32px; height: 32px" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 34h20a8 8 0 0 0 0-16 11 11 0 0 0-21-2 9 9 0 0 0 1 18z" fill="#C9A0FF" stroke="#FFF4FB" stroke-width="3" stroke-linejoin="round"></path></svg></div>
<div style="width: 48px; height: 48px; border-radius: 24px; background: #3D1656; display: flex; align-items: center; justify-content: center"><svg style="width: 32px; height: 32px" viewBox="0 0 48 48" aria-hidden="true"><path d="M30 8a16 16 0 1 0 10 26 13 13 0 0 1-10-26z" fill="#7B2CBF" stroke="#FFF4FB" stroke-width="3" stroke-linejoin="round"></path></svg></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
